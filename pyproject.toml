[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "okhome"
version = "0.1.0"
description = "Unofficial async client for the OK Hjem electricity API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Documentation = "https://github.com/triangledog/okhome#readme"
Issues = "https://github.com/triangledog/okhome/issues"
Repository = "https://github.com/triangledog/okhome"

[project.optional-dependencies]
test = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["okhome"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["okhome"]
